<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>消防站空气呼吸器气瓶充装与检测系统</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="brand-mark">消</span>
    <div class="brand-text">
      <h1>空气呼吸器气瓶充装与检测</h1>
      <span class="brand-sub">特勤消防救援一站 · 装备室</span>
    </div>
  </div>
  <div class="top-actions">
    <span id="adapterName" class="adapter-tag" title="压力读数来源"></span>
    <button class="btn btn-ghost" id="bellBtn" title="到期提醒">
      🔔 <span id="bellCount" class="bell-count hidden">0</span>
    </button>
    <select id="actorSelect" class="actor-select" title="当前操作人（决定操作权限）"></select>
  </div>
</header>

<nav class="tabs" id="tabs">
  <button data-view="ledger" class="tab active">装备台账</button>
  <button data-view="issues" class="tab">任务领用</button>
  <button data-view="returns" class="tab">归队检查</button>
  <button data-view="batches" class="tab">充装组批</button>
  <button data-view="retests" class="tab">压力复测</button>
  <button data-view="pairs" class="tab">配套核验</button>
  <button data-view="due" class="tab">检验到期</button>
  <button data-view="events" class="tab tab-aux">全程事件</button>
</nav>

<main id="view" class="view"><!-- 视图渲染 --></main>

<div id="toast" class="toast hidden"></div>
<div id="drawerMask" class="drawer-mask hidden"></div>
<aside id="drawer" class="drawer hidden"></aside>

<script src="app.js"></script>
</body>
</html>
